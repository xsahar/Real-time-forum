<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-time Forum</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/components/posts.css">
    <link rel="stylesheet" href="/static/css/components/forms.css">
    <link rel="stylesheet" href="/static/css/components/chat.css">
</head>
<body>
    <!-- Navigation initially hidden -->
    <nav class="main-nav" style="display: none;">
        <div class="nav-left">
            <a href="/" class="nav-link" data-link>Home</a>
            <a href="/new-post" class="nav-link" data-link>New Post</a>
        </div>
        <div class="nav-right">
            <button id="logout-btn">Logout</button>
        </div>
    </nav>

    <main id="app">
        <!-- Single auth container for login/register -->
        <div id="auth-container" class="auth-container">
            <!-- Login form initially visible -->
            <div class="auth-form">
                <h2>Login</h2>
                <form id="login-form" method="POST" novalidate>
                    <div class="form-group">
                        <input type="text" name="identifier" placeholder="Email or Nickname" required>
                    </div>
                    <div class="form-group">
                        <input type="password" name="password" placeholder="Password" required>
                    </div>
                    <button type="submit" class="submit-btn">Login</button>
                    <p class="auth-switch">
                        No account? <a href="#" id="show-register">Register</a>
                    </p>
                </form>
            </div>
        </div>

        <!-- Content containers initially hidden -->
        <div id="content" style="display: none;">
            <div id="posts-container"></div>
            <div id="chat-container">
                <div class="chat-users">
                    <h3>Online Users</h3>
                    <div id="online-users"></div>
                </div>
                <div class="chat-messages">
                    <div id="message-list"></div>
                    <form id="message-form">
                        <input type="text" placeholder="Type a message...">
                        <button type="submit">Send</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="/static/js/main.js"></script>
</body>
</html>
