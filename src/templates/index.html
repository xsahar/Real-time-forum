<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forum SPA</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="/static/css/new-post.css">
    <link rel="stylesheet" href="/static/css/post.css">
    <link rel="stylesheet" href="/static/css/loading.css">
    <link rel="stylesheet" href="/static/css/chat.css">
</head>

<body>
    <!-- Auth Section -->
    <section id="auth-section" class="page">
        <div class="auth-forms">
            <!-- Login Form -->
            <form id="login-form" class="hidden">
                <h2>Login</h2>
                <input type="text" id="login-identifier" placeholder="Email or Nickname" required>
                <input type="password" id="login-password" placeholder="Password" required>
                <button type="submit">Login</button>
                <p>Need an account? <a href="#" id="show-register">Register</a></p>
            </form>

            <!-- Register Form -->
            <form id="register-form">
                <h2>Register</h2>
                <input type="text" id="reg-nickname" placeholder="Nickname" required>
                <input type="number" id="reg-age" placeholder="Age" required min="13">
                <select id="reg-gender" required>
                    <option value="">Select Gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                </select>
                <input type="text" id="reg-firstname" placeholder="First Name" required>
                <input type="text" id="reg-lastname" placeholder="Last Name" required>
                <input type="email" id="reg-email" placeholder="Email" required>
                <input type="password" id="reg-password" placeholder="Password" required>
                <button type="submit">Register</button>
                <p>Already have an account? <a href="#" id="show-login">Login</a></p>
            </form>
        </div>
    </section>

    <!-- Main Content Section -->
    <section id="main-section" class="page hidden">
        <nav>
            <div class="logo">Forum</div>
            <div class="nav-links">
                <span class="user-info"></span>
                <a href="#" id="nav-home">Home</a>
                <a href="#" id="create-post-btn">New Post</a>
                <button id="logout-btn">Logout</button>
            </div>
        </nav>

        <div class="content-wrapper">
            <main id="main-content">
                <!-- Create Post Form -->
                <div id="create-post-section" class="create-post-container hidden">
                    <h2>Create New Post</h2>
                    <form id="create-post-form" class="create-post-form">
                        <div class="form-group">
                            <label for="create-post-title">Title</label>
                            <input type="text" id="create-post-title" required minlength="3">
                        </div>
                        <div class="form-group">
                            <label for="create-post-category">Category</label>
                            <select id="create-post-category" required>
                                <option value="">Select a category</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="create-post-content">Content</label>
                            <textarea id="create-post-content" required minlength="10"></textarea>
                        </div>
                        <div class="post-actions">
                            <button type="button" class="cancel-btn" id="cancel-post">Cancel</button>
                            <button type="submit" class="submit-btn">Create Post</button>
                        </div>
                    </form>
                </div>

                <!-- Posts Feed -->
                <div id="posts-feed" class="posts-container">
                    <!-- Posts will be loaded here -->
                    <div class="loading-placeholder">Loading posts...</div>
                </div>
            </main>

            <!-- Chat System - Fix the nesting -->
            <div class="chat-system">
                <button id="chat-toggle" class="chat-toggle">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10z"></path>
                    </svg>
                </button>

                <aside id="chat-section" class="chat-container">
                    <div class="chat-header">
                        <h3>Online Users</h3>
                        <button class="back-to-users" style="display: none;">←</button>
                    </div>
                    <div class="users-list">
                        <div class="loading-placeholder">Loading users...</div>
                    </div>
                    <div class="chat-messages" style="display: none;">
                        <div class="messages-container"></div>
                        <div class="message-input">
                            <input type="text" placeholder="Type a message...">
                            <button class="send-message">Send</button>
                        </div>
                    </div>
                </aside>
            </div>
        </div> <!-- Close content-wrapper -->
    </section> <!-- Close main-section -->

    <!-- Scripts -->
    <script src="/static/js/app.js" type="module"></script>
</body>

</html>
